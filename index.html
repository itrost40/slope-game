<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slope Practice Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
  --bg: #f8f9fb;
  --fg: #181a1b;
  --accent: #007bff;
  --grid: #b0b6c3;
  --graph-bg: #e6e9f0;
  --segment: #007bff;
  --label-bg: #fff;
  --label-fg: #181a1b;
  --graph-border: #444a5a;
    }
    [data-theme="dark"] {
  --bg: #181a1b;
  --fg: #f8f9fa;
  --accent: #0dcaf0;
  --grid: #4a4e5a;
  --graph-bg: #23242a;
  --segment: #0dcaf0;
  --label-bg: #23272b;
  --label-fg: #f8f9fa;
  --graph-border: #b0b6c3;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      transition: background 0.2s, color 0.2s;
    }
    .game-container {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .graph-area {
  flex: 1 1 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-width: 0;
  /* No border here, only on canvas */
    }
    #graph-canvas {
  width: 100%;
  height: 100%;
  max-width: 100vw;
  max-height: 100vh;
  background: var(--graph-bg);
  display: block;
  border-radius: 0.5rem;
  box-shadow: 0 0 16px 0 rgba(0,0,0,0.07);
  /* No border here, border will be drawn in canvas */
  transition: background 0.2s, border 0.2s;
    }
    .endpoint-label {
      position: absolute;
      background: var(--label-bg);
      color: var(--label-fg);
      padding: 0.2em 0.5em;
      border-radius: 0.4em;
      font-size: 1.1em;
      font-weight: 500;
      box-shadow: 0 1px 4px 0 rgba(0,0,0,0.04);
      pointer-events: none;
      user-select: none;
      border: 1px solid var(--grid);
      z-index: 2;
      transition: background 0.2s, color 0.2s;
    }
    .controls-area {
      width: 340px;
      min-width: 280px;
      max-width: 400px;
      background: var(--bg);
      border-left: 1px solid var(--grid);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      gap: 2rem;
      box-shadow: -2px 0 12px 0 rgba(0,0,0,0.03);
      transition: background 0.2s;
    }
    .controls-area h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }
    .form-label {
      color: var(--fg);
    }
    .btn-toggle {
      margin-bottom: 1.5rem;
      align-self: flex-end;
    }
    .btn-primary, .btn-outline-primary {
      font-weight: 500;
      font-size: 1.1em;
    }
    .tries-info {
      font-size: 1.1em;
      color: var(--fg);
      margin-top: 0.5em;
    }
    @media (max-width: 900px) {
      .game-container {
        flex-direction: column;
      }
      .controls-area {
        width: 100vw;
        border-left: none;
        border-top: 1px solid var(--grid);
        box-shadow: 0 -2px 12px 0 rgba(0,0,0,0.03);
        padding: 1.5rem 1rem;
      }
      .graph-area {
        min-height: 320px;
        height: 50vh;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="graph-area">
      <canvas id="graph-canvas"></canvas>
      <div id="labelA" class="endpoint-label"></div>
      <div id="labelB" class="endpoint-label"></div>
    </div>
    <div class="controls-area">
      <button id="toggle-theme" class="btn btn-outline-secondary btn-toggle" title="Toggle dark/light mode">
        <span id="theme-icon" class="bi bi-brightness-high"></span> Toggle Dark/Light
      </button>
      <h2>Slope Practice</h2>
      <form id="guess-form" autocomplete="off">
        <label for="guess-input" class="form-label">Enter the slope (as a fraction or decimal):</label>
        <input type="text" class="form-control mb-2" id="guess-input" placeholder="e.g. 2/3 or 0.67" required autofocus>
        <button type="submit" class="btn btn-primary w-100 mb-2">Submit Guess</button>
        <button type="button" class="btn btn-outline-primary w-100" id="skip-btn">Skip</button>
      </form>
      <div class="tries-info">
        <span id="tries-count">Tries: 0</span><br>
        <span id="timer">Time: 0s</span>
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="resultModalLabel">Result</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="resultModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="new-game-btn" data-bs-dismiss="modal">New Game</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fraction.js@4.2.0/fraction.min.js"></script>
  <script>
    // --- Settings ---
    const GRID_SIZE = 10;
    const PADDING = 40;
    const POINT_RADIUS = 7;
    const SEGMENT_WIDTH = 4;
    const LABEL_OFFSET = 12;
    const MIN_DIST = 3; // min grid distance between endpoints
    const TIMER_INTERVAL = 1000;

    // --- State ---
    let state = {
      pointA: null,
      pointB: null,
      tries: 0,
      startTime: null,
      elapsed: 0,
      solved: false,
      theme: 'light',
    };
    let timerId = null;

    // --- DOM ---
    const canvas = document.getElementById('graph-canvas');
    const labelA = document.getElementById('labelA');
    const labelB = document.getElementById('labelB');
    const guessForm = document.getElementById('guess-form');
    const guessInput = document.getElementById('guess-input');
    const triesCount = document.getElementById('tries-count');
    const timerDisplay = document.getElementById('timer');
    const skipBtn = document.getElementById('skip-btn');
    const resultModal = new bootstrap.Modal(document.getElementById('resultModal'));
    const resultModalBody = document.getElementById('resultModalBody');
    const newGameBtn = document.getElementById('new-game-btn');
    const toggleThemeBtn = document.getElementById('toggle-theme');
    const themeIcon = document.getElementById('theme-icon');

    // --- Utility ---
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function gcd(a, b) {
      if (!b) return a;
      return gcd(b, a % b);
    }
    function slopeFrac(a, b) {
      let dy = b.y - a.y, dx = b.x - a.x;
      if (dx === 0) return null;
      let sign = (dy * dx < 0) ? -1 : 1;
      let num = Math.abs(dy), den = Math.abs(dx);
      let d = gcd(num, den);
      return { num: sign * num / d, den: den / d };
    }
    function slopeDecimal(a, b) {
      let dx = b.x - a.x;
      if (dx === 0) return null;
      return (b.y - a.y) / dx;
    }
    function formatFrac(frac) {
      if (!frac) return 'undefined';
      if (frac.den === 1) return frac.num.toString();
      return frac.num + '/' + frac.den;
    }
    function formatDecimal(val) {
      if (val === null) return 'undefined';
      return val.toFixed(3).replace(/\.0+$/, '');
    }
    function parseSlopeInput(str) {
      str = str.trim();
      if (/^[-+]?\d+\s*\/\s*[-+]?\d+$/.test(str)) {
        let [n, d] = str.split('/').map(s => parseInt(s));
        if (d === 0) return null;
        return n / d;
      }
      let val = Number(str);
      if (!isNaN(val)) return val;
      return null;
    }
    function saveState() {
      localStorage.setItem('slopeGameState', JSON.stringify({
        ...state,
        elapsed: state.solved ? state.elapsed : Math.floor((Date.now() - state.startTime) / 1000),
      }));
    }
    function loadState() {
      let s = localStorage.getItem('slopeGameState');
      if (!s) return false;
      try {
        let obj = JSON.parse(s);
        if (!obj.pointA || !obj.pointB) return false;
        state = obj;
        return true;
      } catch { return false; }
    }
    function clearState() {
      localStorage.removeItem('slopeGameState');
    }
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      state.theme = theme;
      themeIcon.className = theme === 'dark' ? 'bi bi-moon' : 'bi bi-brightness-high';
      saveState();
      // Redraw graph to update grid color
      drawGraph();
    }
    function toggleTheme() {
      setTheme(state.theme === 'light' ? 'dark' : 'light');
    }

    // --- Graph ---
    function resizeCanvas() {
      let area = document.querySelector('.graph-area');
      let w = area.clientWidth, h = area.clientHeight;
      let dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }
    function gridToCanvas(x, y) {
      let w = canvas.width, h = canvas.height;
      let size = Math.min(w, h) - 2 * PADDING * (window.devicePixelRatio || 1);
      let ox = (w - size) / 2, oy = (h - size) / 2;
      let px = ox + (x / GRID_SIZE) * size;
      let py = oy + ((GRID_SIZE - y) / GRID_SIZE) * size;
      return { x: px, y: py };
    }
    function drawGraph() {
      let ctx = canvas.getContext('2d');
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      let w = canvas.width, h = canvas.height;
      let size = Math.min(w, h) - 2 * PADDING * (window.devicePixelRatio || 1);
      let ox = (w - size) / 2, oy = (h - size) / 2;
      // Fill graph background (different from grid color)
      ctx.save();
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--graph-bg');
      ctx.fillRect(ox, oy, size, size);
      ctx.restore();
      // Draw border rectangle around the grid
      ctx.save();
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--graph-border');
      ctx.lineWidth = 3 * (window.devicePixelRatio || 1);
      ctx.strokeRect(ox, oy, size, size);
      ctx.restore();
      // Draw grid lines
      ctx.save();
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--grid');
      ctx.lineWidth = 1.7 * (window.devicePixelRatio || 1);
      for (let i = 0; i <= GRID_SIZE; ++i) {
        let gx = ox + (i / GRID_SIZE) * size;
        let gy = oy + (i / GRID_SIZE) * size;
        ctx.beginPath();
        ctx.moveTo(gx, oy);
        ctx.lineTo(gx, oy + size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(ox, gy);
        ctx.lineTo(ox + size, gy);
        ctx.stroke();
      }
      ctx.restore();
      // Draw axes with high contrast
      ctx.save();
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--fg');
      ctx.lineWidth = 3 * (window.devicePixelRatio || 1);
      ctx.beginPath();
      // x-axis
      let y0 = gridToCanvas(0,0).y;
      ctx.moveTo(ox, y0);
      ctx.lineTo(ox + size, y0);
      // y-axis
      let x0 = gridToCanvas(0,0).x;
      ctx.moveTo(x0, oy);
      ctx.lineTo(x0, oy + size);
      ctx.stroke();
      ctx.restore();
      // Draw segment
      if (state.pointA && state.pointB) {
        let a = gridToCanvas(state.pointA.x, state.pointA.y);
        let b = gridToCanvas(state.pointB.x, state.pointB.y);
        ctx.save();
        ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--segment');
        ctx.lineWidth = SEGMENT_WIDTH * (window.devicePixelRatio || 1);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
        // Draw endpoints
        ctx.save();
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--segment');
        ctx.beginPath();
        ctx.arc(a.x, a.y, POINT_RADIUS * (window.devicePixelRatio || 1), 0, 2*Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(b.x, b.y, POINT_RADIUS * (window.devicePixelRatio || 1), 0, 2*Math.PI);
        ctx.fill();
        ctx.restore();
        // Position endpoint labels
        let areaRect = canvas.getBoundingClientRect();
        let ax = a.x / (window.devicePixelRatio || 1), ay = a.y / (window.devicePixelRatio || 1);
        let bx = b.x / (window.devicePixelRatio || 1), by = b.y / (window.devicePixelRatio || 1);
        labelA.style.left = (ax + areaRect.left - areaRect.left + LABEL_OFFSET) + 'px';
        labelA.style.top = (ay + areaRect.top - areaRect.top - LABEL_OFFSET) + 'px';
        labelB.style.left = (bx + areaRect.left - areaRect.left + LABEL_OFFSET) + 'px';
        labelB.style.top = (by + areaRect.top - areaRect.top - LABEL_OFFSET) + 'px';
        labelA.textContent = `(${state.pointA.x}, ${state.pointA.y})`;
        labelB.textContent = `(${state.pointB.x}, ${state.pointB.y})`;
        labelA.style.display = 'block';
        labelB.style.display = 'block';
      } else {
        labelA.style.display = 'none';
        labelB.style.display = 'none';
      }
    }

    // --- Game Logic ---
    function randomSegment() {
      let a, b;
      do {
        a = { x: randomInt(0, GRID_SIZE), y: randomInt(0, GRID_SIZE) };
        b = { x: randomInt(0, GRID_SIZE), y: randomInt(0, GRID_SIZE) };
      } while ((a.x === b.x && a.y === b.y) || Math.abs(a.x - b.x) < MIN_DIST || Math.abs(a.y - b.y) < MIN_DIST);
      return [a, b];
    }
    function startGame(newSegment = true) {
      if (newSegment) {
        let [a, b] = randomSegment();
        state.pointA = a;
        state.pointB = b;
        state.tries = 0;
        state.solved = false;
        state.startTime = Date.now();
        state.elapsed = 0;
      }
      triesCount.textContent = `Tries: ${state.tries}`;
      timerDisplay.textContent = `Time: ${state.elapsed || 0}s`;
      guessInput.value = '';
      guessInput.disabled = false;
      skipBtn.disabled = false;
      drawGraph();
      saveState();
      if (timerId) clearInterval(timerId);
      timerId = setInterval(() => {
        if (!state.solved) {
          let t = Math.floor((Date.now() - state.startTime) / 1000);
          timerDisplay.textContent = `Time: ${t}s`;
        }
      }, TIMER_INTERVAL);
    }
    function endGamePopup(correct, skipped = false) {
      let frac = slopeFrac(state.pointA, state.pointB);
      let dec = slopeDecimal(state.pointA, state.pointB);
      let tries = state.tries;
      let time = Math.floor((Date.now() - state.startTime) / 1000);
      state.solved = true;
      state.elapsed = time;
      saveState();
      let msg = '';
      if (skipped) {
        msg += `<div class="mb-2">You skipped this one.</div>`;
      } else {
        msg += `<div class="mb-2">Correct! 🎉</div>`;
      }
      msg += `<div><strong>Tries:</strong> ${tries}</div>`;
      msg += `<div><strong>Time:</strong> ${time}s</div>`;
      msg += `<div class="mt-2"><strong>Slope:</strong> <span class="text-primary">${formatFrac(frac)}</span> (<span class="text-secondary">${formatDecimal(dec)}</span>)</div>`;
      resultModalBody.innerHTML = msg;
      resultModal.show();
      guessInput.disabled = true;
      skipBtn.disabled = true;
      if (timerId) clearInterval(timerId);
    }

    // --- Event Handlers ---
    guessForm.addEventListener('submit', function(e) {
      e.preventDefault();
      if (state.solved) return;
      let guess = parseSlopeInput(guessInput.value);
      let actual = slopeDecimal(state.pointA, state.pointB);
      state.tries++;
      triesCount.textContent = `Tries: ${state.tries}`;
      saveState();
      if (guess === null) {
        guessInput.classList.add('is-invalid');
        guessInput.value = '';
        guessInput.placeholder = 'Invalid input';
        return;
      }
      guessInput.classList.remove('is-invalid');
      // Accept if within 0.01 of actual
      if (Math.abs(guess - actual) < 0.01) {
        endGamePopup(true);
      } else {
        guessInput.value = '';
        guessInput.placeholder = 'Try again!';
      }
    });
    skipBtn.addEventListener('click', function() {
      if (state.solved) return;
      endGamePopup(false, true);
    });
    newGameBtn.addEventListener('click', function() {
      clearState();
      startGame(true);
    });
    toggleThemeBtn.addEventListener('click', function() {
      toggleTheme();
    });
    window.addEventListener('resize', function() {
      resizeCanvas();
      drawGraph();
    });

    // --- Init ---
    function init() {
      // Bootstrap icons
      let icon = document.createElement('link');
      icon.rel = 'stylesheet';
      icon.href = 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css';
      document.head.appendChild(icon);
      // Theme
      let prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let loaded = loadState();
      setTheme(state.theme || (prefersDark ? 'dark' : 'light'));
      resizeCanvas();
      if (loaded) {
        startGame(false);
      } else {
        startGame(true);
      }
    }
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
